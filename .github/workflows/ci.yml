name: CI

on:
  pull_request:
    branches: [ main, "release/*" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: nikolareljin/ci-helpers/.github/workflows/python.yml@production
    with:
      python_version: "3.12"
      working_directory: "."
      extra_command: "./update"
      lint_command: "./lint"
      # ./deps is the same script a user runs as step 1, so CI installs exactly
      # what an install installs. It must run before Test rather than as
      # extra_command, because ci-helpers runs the Extra step after Test.
      test_command: "./deps && ./test"
