name: Package

on:
  workflow_dispatch:
  push:
    tags:
      # This repository tags bare, without a "v" prefix: 0.1.0, not v0.1.0.
      # The trigger was "v*", so a tag following the repository's own convention
      # would never have built a release.
      #
      # These are GitHub filter patterns, not regular expressions: "+" means one
      # or more of the preceding character, and "." is literal. So this matches
      # 0.1.0 and 1.21.0, and not a date, a branch name or a bare number.
      - "[0-9]+.[0-9]+.[0-9]+"

# release-build.yml declares `contents: write` on its job, and GitHub requires a
# caller's granted permissions to be a superset of the callee's before it will
# start the run. This repository's default workflow token is `read`, so without
# this block the run ends in startup_failure with no step executed and no log to
# read. That went unnoticed because the trigger used to be `v*` while the only
# tag was `0.1.0` -- nothing had ever reached this workflow to fail.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: nikolareljin/ci-helpers/.github/workflows/release-build.yml@production
    with:
      python_version: "3.12"
      working_directory: "."
      build_command: "./update && ./scripts/package.sh"
      artifact_paths: "dist/**"
      upload_artifact: true
